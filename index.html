<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>⚽ eFootball 金币比价 </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 12px; touch-action: manipulation; }
        .app-container { max-width: 500px; width: 100%; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        header { text-align: center; margin-bottom: 12px; }
        header h1 { font-size: 20px; color: #1a1a2e; margin-bottom: 2px; }
        header .subtitle { color: #888; font-size: 13px; }

        .tab-bar {
            display: flex;
            background: #f1f5f9;
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 14px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.25s;
            min-height: 44px;
        }
        .tab-btn.active {
            background: #6366f1;
            color: white;
            box-shadow: 0 2px 8px rgba(99,102,241,0.3);
        }
        .tab-btn:active { transform: scale(0.96); }

        .rate-banner {
            background: #eef2ff;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .rate-banner .label { color: #4b5563; font-size: 13px; }
        .rate-banner .value { font-weight: 600; color: #1a1a2e; font-size: 14px; }
        .rate-banner .rate-status-chip {
            font-size: 11px;
            color: #4338ca;
            background: #e0e7ff;
            border-radius: 10px;
            padding: 2px 8px;
            white-space: nowrap;
        }
        .rate-banner .refresh-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;

            min-height: 36px;
        }
        .rate-banner .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .source-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;

        .source-selector label { font-size: 13px; color: #4b5563; }

            padding: 4px 8px;

        .source-info { font-size: 12px; color: #4b5563; text-align: center; margin-top: 4px; }

        .card { background: #f8fafc; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
        .card .label { font-size: 14px; color: #64748b; margin-bottom: 6px; display: block; }

        .input-group {
            display: flex;
            align-items: center;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }
        .input-group input {
            flex: 1;
            border: none;
            padding: 12px 14px;
            font-size: 18px;

        .input-group .unit-label {
            padding: 0 14px;
            color: #94a3b8;

            background: #f1f5f9;

            display: flex;
            align-items: center;
        }

        .quick-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .quick-chip {
            flex: 1 1 64px;
            min-height: 40px;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .quick-chip.active {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4338ca;
            font-weight: 600;
        }
        .quick-chip:active { transform: scale(0.97); }

        .result-box {
            background: #1e293b;
            border-radius: 16px;
            padding: 18px;
            color: white;
            text-align: center;
            margin-top: 12px;
        }
        .result-box .label { color: #94a3b8; font-size: 14px; display: block; margin-bottom: 6px; }
        .result-single {
            font-size: 34px;
            font-weight: 700;
            color: #fbbf24;
            padding: 6px 0;
        }
        .result-single .currency { font-size: 22px; font-weight: 400; margin-right: 4px; }

        .detail-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .detail-row span { display: inline-flex; align-items: center; gap: 4px; }
        .detail-row .highlight { color: #e2e8f0; font-weight: 500; }

        .footnote {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
            line-height: 1.6;
        }
        .footnote .byline { color: #6366f1; font-weight: 500; font-size: 12px; }

        .error-banner {
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
        }
        .error-banner button {
            background: none;
            border: none;
            color: #6366f1;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }

        .pack-list { display: flex; flex-direction: column; gap: 10px; }
        .pack-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .pack-row { display: flex; align-items: center; gap: 12px; }
        .pack-item.selected {
            border-color: #6366f1;
            background: #eef2ff;
            box-shadow: 0 2px 10px rgba(99,102,241,0.15);
        }
        .pack-item:active { transform: scale(0.99); }
        .pack-item .check {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
            border-radius: 6px;
            border: 2px solid #cbd5e1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 700;
        }
        .pack-item.selected .check { background: #6366f1; border-color: #6366f1; }
        .pack-item .pack-main { flex: 1; min-width: 0; }
        .pack-item .pack-name { font-size: 15px; font-weight: 600; color: #1a1a2e; }
        .pack-item .pack-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
        .pack-item .pack-price { flex: 0 0 auto; text-align: right; }
        .pack-item .pack-price .jpy { font-size: 17px; font-weight: 700; color: #dc2626; }
        .pack-item .pack-price .per { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .pack-badge {
            display: inline-block;
            background: #fbbf24;
            color: #7c2d12;
            font-size: 10px;
            font-weight: 700;
            border-radius: 4px;
            padding: 1px 5px;
            margin-right: 6px;
            vertical-align: middle;
        }
        .pack-badge.best-badge { background: #16a34a; color: white; margin-left: 6px; margin-right: 0; }

        .qty-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #cbd5e1;
        }
        .qty-row .qty-label { font-size: 12px; color: #64748b; }
        .qty-row button {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: white;
            color: #4b5563;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .qty-row button:disabled { opacity: 0.4; cursor: not-allowed; }
        .qty-row .qty-val { font-size: 15px; font-weight: 600; color: #1a1a2e; min-width: 26px; text-align: center; }
        .qty-row .qty-sub { margin-left: auto; font-size: 12px; color: #6366f1; font-weight: 500; }

        .advanced {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0 12px;
            margin-bottom: 12px;
        }
        .advanced summary {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
            padding: 10px 0;
            min-height: 44px;
            list-style: none;
        }
        .advanced summary::-webkit-details-marker { display: none; }
        .advanced summary::before { content: '▸'; margin-right: 6px; color: #94a3b8; }
        .advanced[open] summary::before { content: '▾'; }
        .advanced .source-selector { margin-bottom: 8px; padding: 6px 0; background: transparent; }
        .advanced .source-info { padding-bottom: 8px; }

        @media (max-width: 480px) {
            .source-selector { flex-direction: column; align-items: stretch; }
            .tab-btn { font-size: 14px; padding: 8px 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        (function () {
            'use strict';

            const e = React.createElement;
            const F = React.Fragment;

            // 日服特惠档位（KONAMI 官方商店 store.konami.net/efootball · 有償分 + 無償分）
            const SALE_PACKS = [
                { id: 'c650',  name: 'Coin 650',  jpy: 500,  paid: 405,  free: 245,  maxQty: 4 },
                { id: 'c840',  name: 'Coin 840',  jpy: 650,  paid: 530,  free: 310,  maxQty: 1 },
                { id: 'c2700', name: 'Coin 2700', jpy: 1900, paid: 1540, free: 1160, maxQty: 1 },
                { id: 'c7300', name: 'Coin 7300', jpy: 4800, paid: 3900, free: 3400, maxQty: 1 }
            ];

            // 欧元卡金币档位（日元价 · KONAMI 欧元商店）
            const EURO_PACKS = [
                { id: 'e100',   coins: 100,   yen: 120 },
                { id: 'e520',   coins: 520,   yen: 610 },
                { id: 'e1050',  coins: 1050,  yen: 1220 },
                { id: 'e2150',  coins: 2150,  yen: 2440 },
                { id: 'e3300',  coins: 3300,  yen: 3680 },
                { id: 'e5800',  coins: 5800,  yen: 6100 },
                { id: 'e12000', coins: 12000, yen: 12000 }
            ];

            // 档位价格最后核对日期（以 KONAMI 官方商店为准）
            const PACK_DATA_VERIFIED_AT = '2026-10-20';

            const FALLBACK_JPY_EUR = 0.0054;
            const FALLBACK_JPY_CNY = 0.0414;
            const FALLBACK_EUR_CNY = 7.5;
            const RATE_CACHE_KEY = 'efootball_rate_cache_v1';

            // ---------- 数据源配置 ----------
            const API_SOURCES = {
                cloudflare: {
                    name: 'Cloudflare Pages (推荐)',
                    url: 'https://latest.currency-api.pages.dev/v1/currencies/jpy.json',
                    parse: (data) => {
                        const eur = data?.jpy?.eur;
                        const cny = data?.jpy?.cny;
                        return { eur, cny };
                    }
                },
                jsdelivr: {
                    name: 'jsDelivr CDN (备选)',
                    url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json',
                    parse: (data) => {
                        const eur = data?.jpy?.eur;
                        const cny = data?.jpy?.cny;
                        return { eur, cny };
                    }
                },
                exchangerate: {
                    name: 'exchangerate.host (ECB)',
                    url: 'https://api.exchangerate.host/latest?base=JPY&symbols=EUR',
                    parse: (data) => {
                        const eur = data?.rates?.EUR;
                        return { eur, cny: null };
                    }
                }
            };

            const API_SOURCES_JPY_CNY = {
                exchangerate: {
                    name: 'exchangerate.host (JPY/CNY)',
                    url: 'https://api.exchangerate.host/latest?base=JPY&symbols=CNY',
                    parse: (data) => data?.rates?.CNY
                }
            };

            const getSourcesInOrder = (preferredKey) => {
                const allKeys = Object.keys(API_SOURCES);
                const others = allKeys.filter(k => k !== preferredKey);
                return [preferredKey, ...others];
            };

            // ---------- 本地缓存 ----------
            const readRateCache = () => {
                try {
                    const raw = localStorage.getItem(RATE_CACHE_KEY);
                    if (!raw) return null;
                    const obj = JSON.parse(raw);
                    if (!obj || typeof obj !== 'object') return null;
                    return obj;
                } catch (err) {
                    return null;
                }
            };

            const writeRateCache = (data) => {
                try {
                    localStorage.setItem(RATE_CACHE_KEY, JSON.stringify(data));
                } catch (err) {
                    // 隐私模式或配额不足时忽略，不影响主流程
                }
            };

            const isValidRate = (v) => typeof v === 'number' && isFinite(v) && v > 0;

            const formatTime = (iso) => {
                if (!iso) return '—';
                const d = new Date(iso);
                if (isNaN(d.getTime())) return '—';
                const pad = (n) => (n < 10 ? '0' + n : '' + n);
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                    + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            };

            // 从缓存对象中取出可用汇率
            const pickCachedRates = (cache) => {
                const c = cache || {};
                return {
                    eur: isValidRate(c.jpyToEurRate) ? c.jpyToEurRate : null,
                    cny: isValidRate(c.jpyToCnyRate) ? c.jpyToCnyRate : null,
                    eurCny: isValidRate(c.eurToCnyRate) ? c.eurToCnyRate : null,
                    updatedAt: typeof c.rateUpdatedAt === 'string' ? c.rateUpdatedAt : null
                };
            };

            function App() {
                // ---------- 状态 ----------
                const cache = React.useMemo(() => pickCachedRates(readRateCache()), []);
                const hasCache = cache.eur !== null || cache.cny !== null;

                const [jpyToEurRate, setJpyToEurRate] = React.useState(cache.eur);
                const [jpyToCnyRate, setJpyToCnyRate] = React.useState(cache.cny);
                const [eurToCnyRate, setEurToCnyRate] = React.useState(cache.eurCny);
                const [loading, setLoading] = React.useState(true);
                const [error, setError] = React.useState(null);
                const [sourceInfo, setSourceInfo] = React.useState('');
                const [preferredSource, setPreferredSource] = React.useState('cloudflare');
                // 'live' | 'cache' | 'fallback' | 'loading'
                const [rateStatus, setRateStatus] = React.useState(hasCache ? 'cache' : 'loading');
                const [rateUpdatedAt, setRateUpdatedAt] = React.useState(cache.updatedAt);

                // 支付方式：'euro' = 欧元卡，'yen' = 日元直购（KONAMI 日服商店）
                const [payMode, setPayMode] = React.useState('euro');
                // cnyPer10Eur 允许空字符串（用户自己填的欧元扣款汇率，默认 60 元 / 10€）
                const [cnyPer10Eur, setCnyPer10Eur] = React.useState('60');
                // 已选的日服特惠档位及份数（可多选，Coin 650 最多 4 份）
                const [packQty, setPackQty] = React.useState({ c2700: 1, c7300: 1 });
                // 已选的欧元卡档位及份数（可多选，不限份数）
                const [euroPackQty, setEuroPackQty] = React.useState({});

                // ---------- 核心获取 ----------
                const fetchRate = async () => {
                    setLoading(true);
                    setError(null);
                    setSourceInfo('');

                    let usedEurSource = null;
                    let usedCnySource = null;
                    let eurRate = null;
                    let cnyRate = null;
                    let eurCnyValue = null;
                    let eurLive = false;
                    let cnyLive = false;

                    const order = getSourcesInOrder(preferredSource);
                    for (const key of order) {
                        const api = API_SOURCES[key];
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 6000);
                        try {
                            const res = await fetch(api.url, { signal: controller.signal });
                            if (!res.ok) throw new Error(`HTTP ${res.status}`);
                            const data = await res.json();
                            const parsed = api.parse(data);
                            if (parsed && isValidRate(parsed.eur)) {
                                eurRate = parsed.eur;
                                usedEurSource = api.name;
                                eurLive = true;
                            }
                            if (parsed && isValidRate(parsed.cny)) {
                                cnyRate = parsed.cny;
                                usedCnySource = api.name;
                                cnyLive = true;
                            }
                            if (eurRate !== null && cnyRate !== null) break;
                        } catch (err) {
                            console.warn(`主源 "${api.name}" 失败:`, err.message);
                        } finally {
                            clearTimeout(timeoutId);
                        }
                    }

                    if (cnyRate === null) {
                        // 尝试专用 JPY→CNY 源
                        const cnyApi = API_SOURCES_JPY_CNY.exchangerate;
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 6000);
                        try {
                            const res = await fetch(cnyApi.url, { signal: controller.signal });
                            if (res.ok) {
                                const data = await res.json();
                                const rate = cnyApi.parse(data);
                                if (isValidRate(rate)) {
                                    cnyRate = rate;
                                    usedCnySource = cnyApi.name;
                                    cnyLive = true;
                                }
                            }
                        } catch (err) {
                            console.warn('JPY→CNY 专用源失败:', err.message);
                        } finally {
                            clearTimeout(timeoutId);
                        }
                    }

                    if (cnyRate === null) {
                        // 间接计算：JPY→EUR × EUR→CNY
                        const eurCnyBase = eurRate !== null ? eurRate : (jpyToEurRate ?? FALLBACK_JPY_EUR);
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 6000);
                        try {
                            const url = 'https://api.exchangerate.host/latest?base=EUR&symbols=CNY';
                            const res = await fetch(url, { signal: controller.signal });
                            if (res.ok) {
                                const data = await res.json();
                                const eurCny = data?.rates?.CNY;
                                if (isValidRate(eurCny)) {
                                    eurCnyValue = eurCny;
                                    cnyRate = eurCnyBase * eurCny;
                                    usedCnySource = `间接 (EUR→CNY ${eurCny.toFixed(4)})`;
                                    cnyLive = true;
                                }
                            }
                        } catch (err) {
                            console.warn('间接 EUR→CNY 失败:', err.message);
                        } finally {
                            clearTimeout(timeoutId);
                        }
                    }

                    // 欧元汇率降级：实时失败 → 本地缓存 → 硬编码备选
                    let usedCache = false;
                    if (eurRate === null) {
                        if (isValidRate(cache.eur)) {
                            eurRate = cache.eur;
                            usedEurSource = `本地缓存 (JPY→EUR · ${formatTime(cache.updatedAt)})`;
                            usedCache = true;
                        } else {
                            eurRate = FALLBACK_JPY_EUR;
                            usedEurSource = '备选 (JPY→EUR)';
                        }
                    }

                    // 人民币汇率降级：实时失败 → 本地缓存 → 硬编码备选
                    if (cnyRate === null) {
                        if (isValidRate(cache.cny)) {
                            cnyRate = cache.cny;
                            usedCnySource = `本地缓存 (JPY→CNY · ${formatTime(cache.updatedAt)})`;
                            usedCache = true;
                        } else {
                            cnyRate = FALLBACK_JPY_CNY;
                            usedCnySource = '备选 (JPY→CNY)';
                        }
                    }

                    const allLive = eurLive && cnyLive;
                    const nextStatus = allLive ? 'live' : (usedCache ? 'cache' : 'fallback');
                    const nowIso = new Date().toISOString();

                    setJpyToEurRate(eurRate);
                    setJpyToCnyRate(cnyRate);
                    if (eurCnyValue !== null) setEurToCnyRate(eurCnyValue);
                    setSourceInfo(`✅ JPY→EUR: ${usedEurSource} | JPY→CNY: ${usedCnySource}`);
                    setRateStatus(nextStatus);

                    if (allLive) {
                        writeRateCache({
                            jpyToEurRate: eurRate,
                            jpyToCnyRate: cnyRate,
                            eurToCnyRate: eurCnyValue,
                            rateUpdatedAt: nowIso,
                            usedEurSource,
                            usedCnySource
                        });
                        setRateUpdatedAt(nowIso);
                        setError(null);
                    } else if (nextStatus === 'cache') {
                        setError('当前使用本地缓存汇率（' + formatTime(rateUpdatedAt || cache.updatedAt) + '），可能不是最新');
                    } else {
                        setError('部分汇率使用备选值，可能不准确');
                    }

                    setLoading(false);
                };

                React.useEffect(() => {
                    fetchRate();
                    const timer = setInterval(fetchRate, 300000);
                    return () => clearInterval(timer);
                }, [preferredSource]);

                // ---------- 计算 ----------
                // 欧元卡：每 10 欧元扣多少人民币（用户手动输入）
                const userCnyPer10Eur = parseFloat(cnyPer10Eur);
                const validCnyPer10Eur = isNaN(userCnyPer10Eur) || userCnyPer10Eur < 0 ? 0 : userCnyPer10Eur;
                const eurRateForCalc = jpyToEurRate ?? FALLBACK_JPY_EUR;

                // ---------- 欧元卡档位 ----------
                // 每档展示「理论单价」（不取整）
                const euroPackList = EURO_PACKS.map(p => {
                    const rawEur = p.yen * eurRateForCalc;
                    const rmb = rawEur * (validCnyPer10Eur / 10);
                    const cnyPerK = p.coins > 0 ? (rmb / p.coins) * 1000 : 0;
                    return { ...p, rawEur, rmb, cnyPerK, qty: euroPackQty[p.id] || 0 };
                });
                const selectedEuro = euroPackList.filter(p => p.qty > 0);
                const euroTotalQty = selectedEuro.reduce((sum, p) => sum + p.qty, 0);
                const euroTotal = selectedEuro.reduce(
                    (acc, p) => ({
                        coins: acc.coins + p.coins * p.qty,
                        yen: acc.yen + p.yen * p.qty
                    }),
                    { coins: 0, yen: 0 }
                );
                // 结算只能整 10 欧：先求欧元总额，再向上取整到整 10 欧
                const euroRawTotalEur = euroTotal.yen * eurRateForCalc;
                const euroSettleEur = Math.ceil(euroRawTotalEur / 10) * 10;
                const euroTotalRmb = (euroSettleEur / 10) * validCnyPer10Eur;
                const euroPerK = euroTotal.coins > 0 ? (euroTotalRmb / euroTotal.coins) * 1000 : 0;
                const toggleEuroPack = (id) => {
                    setEuroPackQty(prev => ({ ...prev, [id]: (prev[id] || 0) > 0 ? 0 : 1 }));
                };
                const changeEuroQty = (id, delta) => {
                    setEuroPackQty(prev => {
                        const cur = prev[id] || 0;
                        return { ...prev, [id]: Math.max(1, cur + delta) };
                    });
                };

                // ---------- 日服特惠档位 ----------
                const cnyRate = jpyToCnyRate ?? FALLBACK_JPY_CNY;
                const packList = SALE_PACKS.map(p => {
                    const coins = p.paid + p.free;
                    const perK = (p.jpy / coins) * 1000;
                    return { ...p, coins, perK, cnyPerK: perK * cnyRate, qty: packQty[p.id] || 0 };
                });
                const bestPackId = packList.reduce((best, p) => (!best || p.perK < best.perK) ? p : best, null)?.id;
                const selected = packList.filter(p => p.qty > 0);
                const totalQty = selected.reduce((sum, p) => sum + p.qty, 0);
                const packTotal = selected.reduce(
                    (acc, p) => ({
                        coins: acc.coins + p.coins * p.qty,
                        jpy: acc.jpy + p.jpy * p.qty,
                        paid: acc.paid + p.paid * p.qty,
                        free: acc.free + p.free * p.qty
                    }),
                    { coins: 0, jpy: 0, paid: 0, free: 0 }
                );
                const packTotalCny = packTotal.jpy * cnyRate;
                const packPerK = packTotal.coins > 0 ? (packTotalCny / packTotal.coins) * 1000 : 0;
                const togglePack = (id) => {
                    setPackQty(prev => ({ ...prev, [id]: (prev[id] || 0) > 0 ? 0 : 1 }));
                };
                const changeQty = (id, delta) => {
                    const pack = SALE_PACKS.find(p => p.id === id);
                    const max = pack ? pack.maxQty : 1;
                    setPackQty(prev => {
                        const cur = prev[id] || 0;
                        return { ...prev, [id]: Math.min(max, Math.max(1, cur + delta)) };
                    });
                };

                // 顶栏汇率：用更直观的口径展示
                const rateBannerLabel = payMode === 'euro' ? '💱 自动汇率（日元 → 欧元）' : '💱 自动汇率（日元 → 人民币）';
                const rateBannerText = payMode === 'euro'
                    ? `1 EUR ≈ ${(1 / (jpyToEurRate ?? FALLBACK_JPY_EUR)).toFixed(1)} 日元`
                    : `100 日元 ≈ CN¥${((jpyToCnyRate ?? FALLBACK_JPY_CNY) * 100).toFixed(2)}`;
                const rateReady = payMode === 'euro' ? jpyToEurRate !== null : jpyToCnyRate !== null;
                const bannerValue = rateReady ? rateBannerText : '加载中...';

                const rateStatusText = rateStatus === 'live' ? '实时汇率'
                    : rateStatus === 'cache' ? '缓存汇率'
                    : rateStatus === 'fallback' ? '备选汇率' : '加载中';
                const rateUpdatedText = formatTime(rateUpdatedAt);

                // 主指标：每 1000 金币折合人民币（两种支付方式共用）
                const heroPerK = payMode === 'euro' ? euroPerK : packPerK;
                const noSelection = (payMode === 'yen' && selected.length === 0) || (payMode === 'euro' && selectedEuro.length === 0);

                // ---------- 输入处理 ----------
                const handleCnyPer10EurChange = (ev) => {
                    const val = ev.target.value;
                    if (val === '' || /^\d*\.?\d*$/.test(val)) {
                        setCnyPer10Eur(val);
                    }
                };
                // 失焦规范化：去前导零、去尾随小数点，负数归零
                const handleCnyPer10EurBlur = () => {
                    setCnyPer10Eur(prev => {
                        const raw = String(prev).trim();
                        if (raw === '' || raw === '.' || raw === '-') return raw === '' ? '' : '0';
                        const n = parseFloat(raw);
                        if (isNaN(n) || n < 0) return '0';
                        return String(n);
                    });
                };

                const hl = (text) => e('span', { className: 'highlight' }, text);

                // ---------- 渲染 ----------
                return e('div', { className: 'app-container' },
                    e('header', null,
                        e('h1', null, '⚽ eFootball 金币比价'),
                        e('div', { className: 'subtitle' },
                            payMode === 'yen' ? '勾选日服特惠档位 · 实时汇率折算' : '勾选欧元卡档位 · 实时汇率折算')
                    ),

                    e('div', { className: 'tab-bar' },
                        e('button', { className: 'tab-btn ' + (payMode === 'euro' ? 'active' : ''), onClick: () => setPayMode('euro') }, '💳 欧元卡'),
                        e('button', { className: 'tab-btn ' + (payMode === 'yen' ? 'active' : ''), onClick: () => setPayMode('yen') }, '🎌 日元直购')
                    ),

                    error ? e('div', { className: 'error-banner' },
                        '⚠️ ' + error + ' ',
                        e('button', { onClick: fetchRate }, '重试')
                    ) : null,

                    e('div', { className: 'rate-banner', 'aria-live': 'polite' },
                        e('span', { className: 'label' }, rateBannerLabel),
                        e('span', { className: 'value' }, bannerValue),
                        e('span', { className: 'rate-status-chip' }, rateStatusText),
                        e('button', { className: 'refresh-btn', onClick: fetchRate, disabled: loading },
                            loading ? '刷新中…' : '刷新')
                    ),

                    e('details', { className: 'advanced' },
                        e('summary', null, '⚙️ 高级设置（汇率数据源）'),
                        e('div', { className: 'source-selector' },
                            e('label', { htmlFor: 'sourceSelect' }, '📡 首选数据源：'),
                            e('select', {
                                id: 'sourceSelect',
                                value: preferredSource,
                                onChange: (ev) => setPreferredSource(ev.target.value),
                                disabled: loading
                            },
                                e('option', { value: 'cloudflare' }, 'Cloudflare Pages (推荐)'),
                                e('option', { value: 'jsdelivr' }, 'jsDelivr CDN (备选)'),
                                e('option', { value: 'exchangerate' }, 'exchangerate.host (ECB)')
                            ),
                            e('span', { style: { fontSize: '12px', color: '#6b7280' } }, '(切换后自动刷新)')
                        ),
                        e('div', { className: 'source-info', 'aria-live': 'polite' }, sourceInfo),
                        e('div', { className: 'source-info' }, '汇率状态：' + rateStatusText + ' · 上次成功更新：' + rateUpdatedText)
                    ),

                    payMode === 'euro' ? e('div', { className: 'card' },
                        e('span', { className: 'label' }, '💳 欧元卡档位（点击可多选）'),
                        e('div', { className: 'pack-list' },
                            euroPackList.map(p => {
                                const isSel = p.qty > 0;
                                return e('div', {
                                    key: p.id,
                                    className: 'pack-item ' + (isSel ? 'selected' : ''),
                                    role: 'checkbox',
                                    'aria-checked': isSel,
                                    tabIndex: 0,
                                    'aria-label': `${p.coins.toLocaleString()} 金币，JP¥${p.yen.toLocaleString()}`,
                                    onClick: () => toggleEuroPack(p.id),
                                    onKeyDown: (ev) => {
                                        if (ev.target !== ev.currentTarget) return;
                                        if (ev.key === ' ' || ev.key === 'Enter') {
                                            ev.preventDefault();
                                            toggleEuroPack(p.id);
                                        }
                                    }
                                },
                                    e('div', { className: 'pack-row' },
                                        e('div', { className: 'check' }, isSel ? '✓' : ''),
                                        e('div', { className: 'pack-main' },
                                            e('div', { className: 'pack-name' }, `${p.coins.toLocaleString()} 金币`),
                                            e('div', { className: 'pack-meta' },
                                                `JP¥${p.yen.toLocaleString()} ≈ €${p.rawEur.toFixed(2)} ≈ CN¥${p.rmb.toFixed(2)}`)
                                        ),
                                        e('div', { className: 'pack-price' },
                                            e('div', { className: 'jpy' }, `JP¥${p.yen.toLocaleString()}`),
                                            e('div', { className: 'per' }, `≈CN¥${p.cnyPerK.toFixed(0)}/千币`)
                                        )
                                    ),
                                    isSel ? e('div', { className: 'qty-row', onClick: (ev) => ev.stopPropagation() },
                                        e('span', { className: 'qty-label' }, '购买份数'),
                                        e('button', { onClick: () => changeEuroQty(p.id, -1), disabled: p.qty <= 1, 'aria-label': '减少' }, '−'),
                                        e('span', { className: 'qty-val' }, `×${p.qty}`),
                                        e('button', { onClick: () => changeEuroQty(p.id, 1), 'aria-label': '增加' }, '+'),
                                        e('span', { className: 'qty-sub' },
                                            `小计 JP¥${(p.yen * p.qty).toLocaleString()} · ${(p.coins * p.qty).toLocaleString()} 币`)
                                    ) : null
                                );
                            })
                        ),
                        e('div', { style: { fontSize: '12px', color: '#94a3b8', marginTop: '10px', textAlign: 'center', lineHeight: 1.6 } },
                            '数据来源：KONAMI 官方商店（欧元卡）· 实时汇率自动获取',
                            e('br'),
                            '每档标注为理论单价；实际结算按整 10 欧向上取整（见下方结果）',
                            e('br'),
                            '档位价格最后核对日期：' + PACK_DATA_VERIFIED_AT
                        )
                    ) : null,

                    payMode === 'euro' ? e('div', { className: 'card' },
                        e('span', { className: 'label' }, '💳 淘宝：每 10 欧元扣多少人民币'),
                        e('div', { className: 'input-group' },
                            e('input', {
                                type: 'text',
                                inputMode: 'decimal',
                                value: cnyPer10Eur,
                                onChange: handleCnyPer10EurChange,
                                onBlur: handleCnyPer10EurBlur,
                                placeholder: '60',
                                'aria-label': '每 10 欧元扣多少人民币'
                            }),
                            e('span', { className: 'unit-label' }, 'CN¥ / 10€')
                        ),
                        e('div', { style: { fontSize: '12px', color: '#94a3b8', marginTop: '6px' } },
                            '按淘宝的实际售价填，默认 60（即 1 欧元 = 6 元）')
                    ) : null,

                    payMode === 'yen' ? e('div', { className: 'card' },
                        e('span', { className: 'label' }, '🎌 日服特惠档位（点击可多选）'),
                        e('div', { className: 'pack-list' },
                            packList.map(p => {
                                const isSel = p.qty > 0;
                                return e('div', {
                                    key: p.id,
                                    className: 'pack-item ' + (isSel ? 'selected' : ''),
                                    role: 'checkbox',
                                    'aria-checked': isSel,
                                    tabIndex: 0,
                                    'aria-label': `${p.name}，${p.coins.toLocaleString()} 金币，JP¥${p.jpy}`,
                                    onClick: () => togglePack(p.id),
                                    onKeyDown: (ev) => {
                                        if (ev.target !== ev.currentTarget) return;
                                        if (ev.key === ' ' || ev.key === 'Enter') {
                                            ev.preventDefault();
                                            togglePack(p.id);
                                        }
                                    }
                                },
                                    e('div', { className: 'pack-row' },
                                        e('div', { className: 'check' }, isSel ? '✓' : ''),
                                        e('div', { className: 'pack-main' },
                                            e('div', { className: 'pack-name' },
                                                e('span', { className: 'pack-badge' }, 'SALE'),
                                                p.name,
                                                p.id === bestPackId ? e('span', { className: 'pack-badge best-badge' }, '最划算') : null
                                            ),
                                            e('div', { className: 'pack-meta' },
                                                `${p.paid.toLocaleString()} 有偿 + ${p.free.toLocaleString()} 无偿 = ${p.coins.toLocaleString()} 金币`),
                                            e('div', { className: 'pack-meta' }, `商店限购 ${p.maxQty} 次`)
                                        ),
                                        e('div', { className: 'pack-price' },
                                            e('div', { className: 'jpy' }, `JP¥${p.jpy.toLocaleString()}`),
                                            e('div', { className: 'per' }, `≈CN¥${p.cnyPerK.toFixed(0)}/千币`)
                                        )
                                    ),
                                    (isSel && p.maxQty > 1) ? e('div', { className: 'qty-row', onClick: (ev) => ev.stopPropagation() },
                                        e('span', { className: 'qty-label' }, `购买份数（最多 ${p.maxQty} 份）`),
                                        e('button', { onClick: () => changeQty(p.id, -1), disabled: p.qty <= 1, 'aria-label': '减少' }, '−'),
                                        e('span', { className: 'qty-val' }, `×${p.qty}`),
                                        e('button', { onClick: () => changeQty(p.id, 1), disabled: p.qty >= p.maxQty, 'aria-label': '增加' }, '+'),
                                        e('span', { className: 'qty-sub' },
                                            `小计 JP¥${(p.jpy * p.qty).toLocaleString()} · ${(p.coins * p.qty).toLocaleString()} 币`)
                                    ) : null
                                );
                            })
                        ),
                        e('div', { style: { fontSize: '12px', color: '#94a3b8', marginTop: '10px', textAlign: 'center', lineHeight: 1.6 } },
                            '数据来源：KONAMI 官方商店 store.konami.net（日服）',
                            e('br'),
                            `1 日元 ≈ ${cnyRate.toFixed(6)} 人民币 · 实时汇率自动获取`,
                            e('br'),
                            '档位价格最后核对日期：' + PACK_DATA_VERIFIED_AT
                        )
                    ) : null,

                    e('div', { className: 'result-box', 'aria-live': 'polite' },
                        e('span', { className: 'label' }, '💰 每 1,000 金币折合人民币'),

                        e('div', { className: 'result-single' },
                            noSelection
                                ? e('span', { style: { fontSize: '20px', fontWeight: 500, color: '#94a3b8' } }, '请先选择档位')
                                : e(F, null, e('span', { className: 'currency' }, 'CN¥'), heroPerK.toFixed(2))
                        ),

                        payMode === 'euro' ? e(F, null,
                            e('div', { className: 'detail-row' },
                                e('span', null, '🪙 合计 ', hl(euroTotal.coins.toLocaleString()), ' 金币 · 已选 ',
                                    hl(String(selectedEuro.length)), ' 档 ', hl(String(euroTotalQty)), ' 份')),
                            e('div', { className: 'detail-row' },
                                e('span', null, '💶 需付 JP¥', hl(euroTotal.yen.toLocaleString()), ' → 理论 €',
                                    hl(euroRawTotalEur.toFixed(2)), ' → 整10欧结算 €', hl(euroSettleEur.toLocaleString()))),
                            e('div', { className: 'detail-row' },
                                e('span', null, '💳 淘宝按 ',
                                    hl(validCnyPer10Eur + ' 元 / 10€'),
                                    '：实际 ≈ ', hl('CN¥' + euroTotalRmb.toFixed(2))))
                        ) : e(F, null,
                            e('div', { className: 'detail-row' },
                                e('span', null, '🪙 合计 ', hl(packTotal.coins.toLocaleString()), ' 金币 · 已选 ',
                                    hl(String(selected.length)), ' 档 ', hl(String(totalQty)), ' 份')),
                            e('div', { className: 'detail-row' },
                                e('span', null, '💴 需付 JP¥', hl(packTotal.jpy.toLocaleString()), ' ≈ ',
                                    hl('CN¥' + packTotalCny.toFixed(2))))
                        )
                    ),

                    e('div', { className: 'footnote' },
                        `汇率数据：优先直接获取 JPY→CNY，若不可用则间接换算 · 备选 JPY/CNY: ${FALLBACK_JPY_CNY}`,
                        e('br'),
                        `档位价格最后核对日期：${PACK_DATA_VERIFIED_AT}，实际购买前请以 KONAMI 官方商店为准`,
                        e('br'),
                        e('span', { className: 'byline' }, 'by guiqulaixi')
                    )
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(e(App));
        })();
    </script>
</body>
</html>
