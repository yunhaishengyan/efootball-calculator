<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>eFootball 金币比价 · 记账与筹划</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <!-- 引入优雅的衬线字体用于数字与标题刊印 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
            --font-num: "Newsreader", "Charter", "Georgia", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", sans-serif;

            /* 蜗牛读书 / 微信读书经典纸质感配色 */
            --bg-page: #F6F5F1;
            --bg-card: #FFFFFF;
            --bg-subtle: #F0EEE8;
            --bg-hover: #ECE9E1;
            
            --border-light: #E7E4DC;
            --border-subtle: #EDEAE3;
            --border-dashed: #DCD8CD;

            --text-heading: #1C1917;
            --text-main: #292524;
            --text-secondary: #78716C;
            --text-tertiary: #A8A29E;

            --accent: #2C3E50;
            --accent-soft: rgba(44, 62, 80, 0.08);
            --accent-emerald: #2D6A4F;
            --accent-warm: #8C6D37;

            --receipt-bg: #FFFFFF;
            --receipt-border: #DDD8CD;
            --receipt-shadow: 0 12px 36px rgba(44, 39, 34, 0.06), 0 2px 6px rgba(44, 39, 34, 0.03);

            --shadow-card: 0 4px 20px rgba(28, 25, 23, 0.03);
            --transition-smooth: all 0.28s cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="dark"] {
            --bg-page: #17181A;
            --bg-card: #202226;
            --bg-subtle: #272A30;
            --bg-hover: #2F333B;

            --border-light: #2E323A;
            --border-subtle: #262930;
            --border-dashed: #3A3F4A;

            --text-heading: #F5F5F3;
            --text-main: #E5E3DF;
            --text-secondary: #9E9B95;
            --text-tertiary: #6E6C66;

            --accent: #9BB0C1;
            --accent-soft: rgba(155, 176, 193, 0.12);
            --accent-emerald: #52B788;
            --accent-warm: #D4AF37;

            --receipt-bg: #1F2126;
            --receipt-border: #323640;
            --receipt-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);

            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        #root { min-width: 0; width: 100%; display: flex; justify-content: center; }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: var(--font-sans);
            padding: 32px 16px;
            letter-spacing: 0.01em;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease;
        }

        .editorial-wrapper {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        @media (min-width: 900px) {
            body { padding: 50px 24px; }
            .editorial-wrapper { max-width: 1040px; }
            .book-layout {
                display: grid;
                grid-template-columns: 1fr 380px;
                gap: 36px;
                align-items: start;
            }
            .book-right-panel {
                position: sticky;
                top: 40px;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
        }

        /* 顶部品牌与题头 */
        header.book-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }
        .book-title-group h1 {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            color: var(--text-heading);
            letter-spacing: 0.04em;
        }
        .book-title-group .sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition-smooth);
        }
        .theme-btn:hover {
            color: var(--text-heading);
            background: var(--bg-subtle);
        }

        /* 书卷式选项卡切换 */
        .segmented-nav {
            display: flex;
            background: var(--bg-subtle);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 20px;
        }
        .segmented-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 0;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .segmented-btn.active {
            background: var(--bg-card);
            color: var(--text-heading);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* 汇率与资讯小签（微小注脚感） */
        .rate-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .rate-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .rate-meta .title { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.05em; text-transform: uppercase; }
        .rate-meta .num { font-family: var(--font-num); font-size: 15px; font-weight: 600; color: var(--text-heading); }
        .rate-refresh-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            padding: 4px;
        }
        .rate-refresh-btn:hover { color: var(--text-heading); }

        /* 极简行情决策比对条 */
        .comparison-slate {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 22px;
        }
        .comp-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            position: relative;
        }
        .comp-grid::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 4px;
            bottom: 4px;
            width: 1px;
            background: var(--border-subtle);
        }
        .comp-item { padding: 0 4px; }
        .comp-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .comp-tag {
            font-size: 10px;
            color: var(--accent-emerald);
            background: rgba(45, 106, 79, 0.08);
            border-radius: 4px;
            padding: 1px 5px;
            font-weight: 600;
        }
        .comp-num {
            font-family: var(--font-num);
            font-size: 22px;
            font-weight: 600;
            color: var(--text-heading);
            line-height: 1.2;
        }
        .comp-num span { font-size: 12px; font-family: var(--font-sans); color: var(--text-tertiary); font-weight: normal; margin-left: 2px; }
        .comp-desc { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
        .comp-summary {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-dashed);
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        .comp-summary em {
            font-style: normal;
            font-family: var(--font-num);
            font-weight: 600;
            color: var(--text-heading);
            font-size: 14px;
        }

        /* 章节卡片（Section Cards） */
        .chapter-box {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
        }
        .chapter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .chapter-title {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-heading);
            letter-spacing: 0.02em;
        }
        .chapter-note { font-size: 12px; color: var(--text-tertiary); }

        /* 优雅的输入框 */
        .editorial-input-group {
            display: flex;
            align-items: center;
            background: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            overflow: hidden;
            transition: var(--transition-smooth);
        }
        .editorial-input-group:focus-within {
            border-color: var(--text-secondary);
            background: var(--bg-card);
        }
        .editorial-input-group input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font-num);
            font-size: 18px;
            padding: 10px 14px;
            color: var(--text-heading);
        }
        .editorial-input-group .unit {
            padding: 0 14px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 档位列表（微信读书书单式排版） */
        .pack-grid { display: flex; flex-direction: column; gap: 8px; }
        .pack-row-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
        }
        .pack-row-card:hover {
            border-color: var(--text-secondary);
            background: var(--bg-subtle);
        }
        .pack-row-card.selected {
            border-color: var(--text-heading);
            background: var(--bg-subtle);
        }
        [data-theme="dark"] .pack-row-card.selected {
            background: #272A32;
        }
        .pack-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pack-primary {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pack-marker {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1px solid var(--border-dashed);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: transparent;
            transition: var(--transition-smooth);
        }
        .pack-row-card.selected .pack-marker {
            background: var(--text-heading);
            border-color: var(--text-heading);
            color: var(--bg-card);
        }
        .pack-info .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-heading);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pack-info .badge-subtle {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 500;
            background: var(--bg-hover);
            color: var(--text-secondary);
        }
        .pack-info .badge-best {
            background: rgba(45, 106, 79, 0.08);
            color: var(--accent-emerald);
        }
        .pack-info .meta {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
        .pack-valuation {
            text-align: right;
        }
        .pack-valuation .primary-price {
            font-family: var(--font-num);
            font-size: 16px;
            font-weight: 600;
            color: var(--text-heading);
        }
        .pack-valuation .sub-price {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 1px;
        }

        /* 计数控制器 */
        .stepper-belt {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-dashed);
        }
        .stepper-btn {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-heading);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition-smooth);
        }
        .stepper-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .stepper-btn:hover:not(:disabled) { background: var(--bg-hover); }
        .stepper-val {
            font-family: var(--font-num);
            font-size: 15px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        /* ── 核心结果区：精致的【书卷收据票据】 ── */
        .receipt-card {
            background: var(--receipt-bg);
            border: 1px solid var(--receipt-border);
            border-radius: 18px;
            padding: 26px 22px;
            box-shadow: var(--receipt-shadow);
            position: relative;
            overflow: hidden;
        }
        .receipt-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-warm), var(--accent));
        }
        .receipt-stamp {
            text-align: center;
            font-family: var(--font-serif);
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }
        .receipt-main-cost {
            text-align: center;
            padding: 6px 0 12px;
        }
        .receipt-main-cost .curr {
            font-family: var(--font-sans);
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-right: 4px;
        }
        .receipt-main-cost .figure {
            font-family: var(--font-num);
            font-size: 44px;
            font-weight: 600;
            color: var(--text-heading);
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .receipt-coins-yield {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        .receipt-coins-yield b {
            font-family: var(--font-num);
            font-size: 15px;
            color: var(--text-heading);
        }

        .receipt-breakdown {
            border-top: 1px dashed var(--receipt-border);
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 12px;
        }
        .receipt-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            color: var(--text-secondary);
        }
        .receipt-line .val {
            font-family: var(--font-num);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-heading);
        }
        .receipt-line .val small {
            font-family: var(--font-sans);
            font-size: 11px;
            color: var(--text-tertiary);
            margin-left: 4px;
        }

        .editorial-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .action-subtle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-subtle-btn:hover {
            border-color: var(--text-secondary);
            background: var(--bg-subtle);
        }

        /* 移动端优雅吸底 */
        .bottom-float-bar {
            display: none;
        }
        @media (max-width: 899px) {
            body { padding-bottom: 90px; }
            .bottom-float-bar {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                background: var(--receipt-bg);
                border-top: 1px solid var(--border-light);
                padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px));
                display: flex;
                align-items: center;
                justify-content: space-between;
                box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.05);
                z-index: 100;
                transition: transform 0.3s ease;
            }
            .bottom-float-bar.hidden {
                transform: translateY(105%);
            }
            .bf-label { font-size: 11px; color: var(--text-tertiary); }
            .bf-val {
                font-family: var(--font-num);
                font-size: 22px;
                font-weight: 600;
                color: var(--text-heading);
            }
            .bf-btns { display: flex; gap: 8px; }
            .bf-btn {
                background: var(--bg-subtle);
                border: 1px solid var(--border-light);
                border-radius: 8px;
                padding: 8px 12px;
                font-size: 12px;
                color: var(--text-main);
                cursor: pointer;
            }
        }

        /* 吐司提醒 */
        .toast-pill {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-heading);
            color: var(--bg-page);
            padding: 9px 20px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 0.03em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
            z-index: 999;
        }
        .toast-pill.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .book-colophon {
            text-align: center;
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 36px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
            letter-spacing: 0.05em;
            line-height: 1.8;
        }

        #posterCanvas { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <canvas id="posterCanvas"></canvas>

    <script>
        (function () {
            'use strict';

            const e = React.createElement;
            const F = React.Fragment;

            const SALE_PACKS = [
                { id: 'c650',  name: '650 币特惠',  jpy: 500,  paid: 405,  free: 245,  maxQty: 4 },
                { id: 'c840',  name: '840 币特惠',  jpy: 650,  paid: 530,  free: 310,  maxQty: 1 },
                { id: 'c2700', name: '2,700 币特惠', jpy: 1900, paid: 1540, free: 1160, maxQty: 1 },
                { id: 'c7300', name: '7,300 币特惠', jpy: 4800, paid: 3900, free: 3400, maxQty: 1 }
            ];

            const EURO_PACKS = [
                { id: 'e100',   coins: 100,   yen: 120 },
                { id: 'e300',   coins: 300,   yen: 360 },
                { id: 'e500',   coins: 500,   yen: 590 },
                { id: 'e1000',  coins: 1000,  yen: 1160 },
                { id: 'e2000',  coins: 2000,  yen: 2280 },
                { id: 'e3000',  coins: 3000,  yen: 3300 },
                { id: 'e5000',  coins: 5000,  yen: 5300 },
                { id: 'e10000', coins: 10000, yen: 10000 },
                { id: 'e15000', coins: 15000, yen: 14800 }
            ];

            const PACK_DATA_VERIFIED_AT = '2026-10-22';
            const FALLBACK_JPY_EUR = 0.0054;
            const FALLBACK_JPY_CNY = 0.0414;
            const RATE_CACHE_KEY = 'efootball_rate_cache_editorial';

            const API_SOURCE = 'https://latest.currency-api.pages.dev/v1/currencies/jpy.json';

            const readRateCache = () => {
                try {
                    const raw = localStorage.getItem(RATE_CACHE_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch { return null; }
            };

            const writeRateCache = (data) => {
                try { localStorage.setItem(RATE_CACHE_KEY, JSON.stringify(data)); } catch {}
            };

            const isValidRate = (v) => typeof v === 'number' && isFinite(v) && v > 0;
            const formatTime = (iso) => {
                if (!iso) return '—';
                const d = new Date(iso);
                if (isNaN(d.getTime())) return '—';
                const pad = (n) => (n < 10 ? '0' + n : '' + n);
                return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };

            function App() {
                const cache = React.useMemo(() => readRateCache() || {}, []);
                const [jpyToEurRate, setJpyToEurRate] = React.useState(cache.jpyToEurRate || null);
                const [jpyToCnyRate, setJpyToCnyRate] = React.useState(cache.jpyToCnyRate || null);
                const [loading, setLoading] = React.useState(true);
                const [rateStatus, setRateStatus] = React.useState(cache.jpyToEurRate ? 'cache' : 'loading');
                const [rateUpdatedAt, setRateUpdatedAt] = React.useState(cache.rateUpdatedAt || null);

                const [theme, setTheme] = React.useState('light');
                const [toastMsg, setToastMsg] = React.useState('');

                const resultRef = React.useRef(null);
                const [barHidden, setBarHidden] = React.useState(false);

                const [payMode, setPayMode] = React.useState('euro');
                const [cnyPer10Eur, setCnyPer10Eur] = React.useState('60');
                const [euroSettleMode, setEuroSettleMode] = React.useState('roundUp');
                const [packQty, setPackQty] = React.useState({ c2700: 1, c7300: 1 });
                const [euroPackQty, setEuroPackQty] = React.useState({});

                React.useEffect(() => {
                    document.documentElement.setAttribute('data-theme', theme);
                }, [theme]);

                React.useEffect(() => {
                    const el = resultRef.current;
                    if (!el || typeof IntersectionObserver === 'undefined') return;
                    const io = new IntersectionObserver((entries) => {
                        entries.forEach((entry) => {
                            setBarHidden(entry.isIntersecting && entry.intersectionRatio >= 0.45);
                        });
                    }, { threshold: [0, 0.45, 1] });
                    io.observe(el);
                    return () => io.disconnect();
                }, []);

                const showToast = (msg) => {
                    setToastMsg(msg);
                    setTimeout(() => setToastMsg(''), 2400);
                };

                const fetchRate = async () => {
                    setLoading(true);
                    let eurRate = null, cnyRate = null;
                    try {
                        const res = await fetch(API_SOURCE);
                        if (res.ok) {
                            const data = await res.json();
                            if (isValidRate(data?.jpy?.eur)) eurRate = data.jpy.eur;
                            if (isValidRate(data?.jpy?.cny)) cnyRate = data.jpy.cny;
                        }
                    } catch {}

                    if (eurRate === null) eurRate = cache.jpyToEurRate || FALLBACK_JPY_EUR;
                    if (cnyRate === null) cnyRate = cache.jpyToCnyRate || FALLBACK_JPY_CNY;

                    const nowIso = new Date().toISOString();
                    setJpyToEurRate(eurRate);
                    setJpyToCnyRate(cnyRate);
                    setRateStatus('live');
                    setRateUpdatedAt(nowIso);
                    writeRateCache({ jpyToEurRate: eurRate, jpyToCnyRate: cnyRate, rateUpdatedAt: nowIso });
                    setLoading(false);
                };

                React.useEffect(() => { fetchRate(); }, []);

                const validCnyPer10Eur = parseFloat(cnyPer10Eur) || 0;
                const eurRateForCalc = jpyToEurRate ?? FALLBACK_JPY_EUR;
                const cnyRate = jpyToCnyRate ?? FALLBACK_JPY_CNY;

                const euroPackList = EURO_PACKS.map(p => {
                    const rawEur = p.yen * eurRateForCalc;
                    const rmb = rawEur * (validCnyPer10Eur / 10);
                    const cnyPerK = p.coins > 0 ? (rmb / p.coins) * 1000 : 0;
                    return { ...p, rawEur, rmb, cnyPerK, qty: euroPackQty[p.id] || 0 };
                });
                const selectedEuro = euroPackList.filter(p => p.qty > 0);
                const euroTotal = selectedEuro.reduce((acc, p) => ({
                    coins: acc.coins + p.coins * p.qty,
                    yen: acc.yen + p.yen * p.qty
                }), { coins: 0, yen: 0 });

                const euroRawTotalEur = euroTotal.yen * eurRateForCalc;
                const euroSettleEur = Math.ceil(euroRawTotalEur / 10) * 10;
                const euroRemainderEur = euroSettleEur > 0 ? (euroSettleEur - euroRawTotalEur) : 0;
                const euroRemainderRmb = (euroRemainderEur / 10) * validCnyPer10Eur;

                const euroUsedEur = euroSettleMode === 'roundUp' ? euroSettleEur : euroRawTotalEur;
                const euroTotalRmb = (euroUsedEur / 10) * validCnyPer10Eur;
                const euroPerK = euroTotal.coins > 0 ? (euroTotalRmb / euroTotal.coins) * 1000 : 0;
                const euroAltRmb = ((euroSettleMode === 'roundUp' ? euroRawTotalEur : euroSettleEur) / 10) * validCnyPer10Eur;

                const packList = SALE_PACKS.map(p => {
                    const coins = p.paid + p.free;
                    const perK = (p.jpy / coins) * 1000;
                    return { ...p, coins, perK, cnyPerK: perK * cnyRate, qty: packQty[p.id] || 0 };
                });
                const selectedYen = packList.filter(p => p.qty > 0);
                const packTotal = selectedYen.reduce((acc, p) => ({
                    coins: acc.coins + p.coins * p.qty,
                    jpy: acc.jpy + p.jpy * p.qty
                }), { coins: 0, jpy: 0 });
                const packTotalCny = packTotal.jpy * cnyRate;
                const packPerK = packTotal.coins > 0 ? (packTotalCny / packTotal.coins) * 1000 : 0;

                const heroPerK = payMode === 'euro' ? euroPerK : packPerK;
                const noSelection = (payMode === 'yen' && selectedYen.length === 0) || (payMode === 'euro' && selectedEuro.length === 0);

                const euroUnitCost = (p) => {
                    if (!(p.coins > 0) || !(validCnyPer10Eur > 0)) return Infinity;
                    const rawEur = p.yen * eurRateForCalc;
                    const chargeEur = euroSettleMode === 'roundUp' ? Math.ceil((rawEur - 1e-9) / 10) * 10 : rawEur;
                    return (chargeEur / 10) * validCnyPer10Eur / p.coins * 1000;
                };
                const bestYen = packList.reduce((best, p) => (!best || p.cnyPerK < best.cnyPerK ? p : best), null);
                const bestEuro = euroPackList.reduce((best, p) => {
                    const cost = euroUnitCost(p);
                    return (!best || cost < best.cost) ? { pack: p, cost } : best;
                }, null);
                const yenCostOk = !!(bestYen && isFinite(bestYen.cnyPerK) && bestYen.cnyPerK > 0);
                const euroCostOk = !!(bestEuro && isFinite(bestEuro.cost) && bestEuro.cost > 0);
                const yenCheaper = (euroCostOk && yenCostOk) ? bestYen.cnyPerK <= bestEuro.cost : true;
                const compareDelta = (euroCostOk && yenCostOk) ? Math.abs(bestEuro.cost - bestYen.cnyPerK) : 0;
                const compareDeltaPct = (euroCostOk && yenCostOk && bestYen.cnyPerK > 0) ? Math.abs(bestEuro.cost / bestYen.cnyPerK - 1) * 100 : 0;

                const copyText = (text) => {
                    const done = () => showToast('已收录至剪贴板');
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(done).catch(() => showToast('复制未成功'));
                    } else {
                        showToast('请手动复制');
                    }
                };

                const handleCopyText = () => {
                    if (noSelection) return showToast('请先选择充值档位');
                    const coins = payMode === 'euro' ? euroTotal.coins : packTotal.coins;
                    const paid = (euroSettleEur / 10) * validCnyPer10Eur;
                    let text = `【eFootball 筹划记录】\n`;
                    text += `获币量：${coins.toLocaleString()} 金币\n`;
                    if (payMode === 'euro') {
                        text += `实付预估：CN¥${paid.toFixed(2)} (按 €${euroSettleEur} 购卡)\n`;
                        text += euroSettleMode === 'roundUp'
                            ? `结余留存：€${euroRemainderEur.toFixed(2)} (约合 CN¥${euroRemainderRmb.toFixed(2)})\n`
                            : `纯净消耗：CN¥${euroTotalRmb.toFixed(2)}\n`;
                    } else {
                        text += `实付预估：JP¥${packTotal.jpy.toLocaleString()} (约合 CN¥${packTotalCny.toFixed(2)})\n`;
                    }
                    text += `单币均价：约 ¥${heroPerK.toFixed(2)} / 千币\n`;
                    text += `折算时点：${formatTime(rateUpdatedAt)}`;
                    copyText(text);
                };

                // 生成「单向历 / 微信读书」风格的纪念票据（2x Retina + 齿孔票根）
                const handleGeneratePoster = async () => {
                    if (noSelection) return showToast('请先勾选档位以供生成');

                    // 1. 先显式请求衬线字体并等待加载完成，避免 Canvas 提前落笔回退到系统宋体 / Times
                    if (document.fonts && document.fonts.load) {
                        try {
                            await Promise.all([
                                document.fonts.load('600 40px "Newsreader"'),
                                document.fonts.load('500 13px "Newsreader"'),
                                document.fonts.load('600 21px "Noto Serif SC"')
                            ]);
                            await document.fonts.ready;
                        } catch (_) { /* 字体服务不可达时退回 Georgia / 宋体，不阻断出图 */ }
                    }

                    const canvas = document.getElementById('posterCanvas');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;

                    // 2. 高清画布：最低 2 倍像素密度，上限 3 倍以免导出过大卡顿
                    const dpr = Math.min(Math.max(Math.round(window.devicePixelRatio || 1), 2), 3);

                    const SANS = '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif';
                    const SERIF = '"Newsreader", "Charter", Georgia, "Times New Roman", serif';
                    const CJK = '"Noto Serif SC", "Source Han Serif SC", "Songti SC", serif';

                    const isEuro = payMode === 'euro';
                    const items = isEuro ? selectedEuro : selectedYen;
                    const rowH = 38;

                    // —— 版面网格 ——
                    const PAD = 26;
                    const cardX = PAD;
                    const cardY = PAD;
                    const cardW = 408;
                    const innerL = cardX + 24;
                    const innerR = cardX + cardW - 24;
                    const midX = cardX + cardW / 2;

                    const line1Y = cardY + 104;
                    const tableHeadY = line1Y + 22;
                    const firstRowY = line1Y + 44;
                    const notchY = firstRowY + (items.length - 1) * rowH + 30;

                    const amountLabelY = notchY + 34;
                    const amountY = notchY + 82;
                    const coinsY = notchY + 108;

                    const showRemainder = isEuro && euroRemainderEur > 0;
                    const breakdownTop = notchY + 126;
                    const breakdownH = isEuro ? (showRemainder ? 60 : 38) : 0;
                    const contentBottom = isEuro ? breakdownTop + breakdownH : coinsY;

                    // 卡片高度由内容推算，避免底部留下大块空白
                    const cardH = contentBottom - cardY + 68;
                    const logicalW = cardW + PAD * 2;
                    const logicalH = cardH + PAD * 2;

                    canvas.width = Math.round(logicalW * dpr);
                    canvas.height = Math.round(logicalH * dpr);
                    canvas.style.width = logicalW + 'px';
                    canvas.style.height = logicalH + 'px';
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                    const pathRoundRect = (x, y, w, h, r) => {
                        ctx.beginPath();
                        if (typeof ctx.roundRect === 'function') {
                            ctx.roundRect(x, y, w, h, r);
                            return;
                        }
                        const rr = Math.min(r, w / 2, h / 2);
                        ctx.moveTo(x + rr, y);
                        ctx.arcTo(x + w, y, x + w, y + h, rr);
                        ctx.arcTo(x + w, y + h, x, y + h, rr);
                        ctx.arcTo(x, y + h, x, y, rr);
                        ctx.arcTo(x, y, x + w, y, rr);
                        ctx.closePath();
                    };

                    const pad2 = (n) => (n < 10 ? '0' + n : '' + n);
                    const now = new Date();
                    const stamp = `${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}`;

                    // 3. 燕麦纸底
                    ctx.fillStyle = '#F5F3EF';
                    ctx.fillRect(0, 0, logicalW, logicalH);

                    // 4. 白色票面
                    pathRoundRect(cardX, cardY, cardW, cardH, 16);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                    ctx.strokeStyle = '#E3DED4';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // 5. 顶饰短标与票号
                    ctx.fillStyle = '#2C3E50';
                    ctx.fillRect(midX - 22, cardY + 14, 44, 2);

                    ctx.fillStyle = '#A39D93';
                    ctx.font = '600 9px ' + SANS;
                    ctx.textAlign = 'center';
                    ctx.letterSpacing = '1.4px';
                    ctx.fillText(`TICKET NO. ${stamp}`, midX - 0.7, cardY + 34);
                    ctx.letterSpacing = '0px';

                    // 6. 标题与副标
                    ctx.fillStyle = '#1C1917';
                    ctx.font = `600 21px ${CJK}`;
                    ctx.fillText('eFootball 充值筹划签', midX, cardY + 64);

                    ctx.fillStyle = '#78716C';
                    ctx.font = `11px ${SANS}`;
                    ctx.fillText(`${isEuro ? '欧元礼品卡渠道' : '日元特惠直购'} · ${formatTime(rateUpdatedAt)}`, midX, cardY + 84);

                    // 7. 第一道分割虚线
                    ctx.strokeStyle = '#E8E4DA';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(innerL, line1Y);
                    ctx.lineTo(innerR, line1Y);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 8. 勾选档位明细
                    ctx.fillStyle = '#A39D93';
                    ctx.font = `500 11px ${SANS}`;
                    ctx.textAlign = 'left';
                    ctx.fillText('选购项目', innerL, tableHeadY);
                    ctx.textAlign = 'right';
                    ctx.fillText('份数 / 票面', innerR, tableHeadY);

                    let rowY = firstRowY;
                    items.forEach(item => {
                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#292524';
                        ctx.font = `500 13px ${SANS}`;
                        const name = isEuro ? `${item.coins.toLocaleString()} 金币` : item.name;
                        ctx.fillText(name, innerL, rowY);

                        ctx.textAlign = 'right';
                        ctx.fillStyle = '#1C1917';
                        ctx.font = `600 13px ${SERIF}`;
                        const jpyVal = (item.jpy ?? item.yen ?? 0) * item.qty;
                        ctx.fillText(`×${item.qty}   JP¥${jpyVal.toLocaleString()}`, innerR, rowY);
                        rowY += rowH;
                    });

                    // 9. 票据齿孔：用纸色圆片「咬」开卡边，避免 destination-out 把背景也打成透明
                    const notchR = 9;
                    ctx.fillStyle = '#F5F3EF';
                    ctx.beginPath();
                    ctx.arc(cardX, notchY, notchR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cardX + cardW, notchY, notchR, 0, Math.PI * 2);
                    ctx.fill();

                    // 补回切口内侧的描边（右侧半圆走 90° → 270°，即卡内一侧）
                    ctx.strokeStyle = '#E3DED4';
                    ctx.beginPath();
                    ctx.arc(cardX, notchY, notchR, -Math.PI / 2, Math.PI / 2, false);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(cardX + cardW, notchY, notchR, Math.PI / 2, Math.PI * 1.5, false);
                    ctx.stroke();

                    // 撕线
                    ctx.strokeStyle = '#DDD8CD';
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(cardX + notchR + 6, notchY);
                    ctx.lineTo(cardX + cardW - notchR - 6, notchY);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 10. 结算金额：CN¥ 微缩上扬，主数字放大舒展
                    const totalRmb = isEuro ? euroTotalRmb : packTotalCny;
                    const totalCoins = isEuro ? euroTotal.coins : packTotal.coins;

                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#8C827A';
                    ctx.font = `11px ${SANS}`;
                    ctx.fillText('预计折合实际支付', midX, amountLabelY);

                    const rmbText = totalRmb.toFixed(2);
                    ctx.font = `600 40px ${SERIF}`;
                    const numW = ctx.measureText(rmbText).width;
                    ctx.font = `500 14px ${SANS}`;
                    const symW = ctx.measureText('CN¥').width + 7;
                    const startX = midX - (numW + symW) / 2;

                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#8C827A';
                    ctx.font = `500 14px ${SANS}`;
                    ctx.fillText('CN¥', startX, amountY - 5);

                    ctx.fillStyle = '#1C1917';
                    ctx.font = `600 40px ${SERIF}`;
                    ctx.fillText(rmbText, startX + symW, amountY);

                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#57534E';
                    ctx.font = `12px ${SANS}`;
                    ctx.fillText(`获得 ${totalCoins.toLocaleString()} 金币 · 约 ¥${heroPerK.toFixed(2)} / 千币`, midX, coinsY);

                    // 11. 欧元结算专属：买卡面额与卡内留存
                    if (isEuro) {
                        ctx.fillStyle = '#FAF7F1';
                        pathRoundRect(innerL, breakdownTop, cardW - 48, breakdownH, 10);
                        ctx.fill();

                        const row1 = breakdownTop + 22;
                        ctx.font = `11px ${SANS}`;
                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#8A8078';
                        ctx.fillText('购卡方案', innerL + 14, row1);
                        ctx.textAlign = 'right';
                        ctx.fillStyle = '#292524';
                        ctx.fillText(`€${euroSettleEur} 礼品卡 · 约 CN¥${((euroSettleEur / 10) * validCnyPer10Eur).toFixed(1)}`, innerR - 14, row1);

                        if (showRemainder) {
                            const row2 = breakdownTop + 42;
                            ctx.textAlign = 'left';
                            ctx.fillStyle = '#8A8078';
                            ctx.fillText('卡内留存', innerL + 14, row2);
                            ctx.textAlign = 'right';
                            ctx.fillStyle = '#2D6A4F';
                            ctx.fillText(`€${euroRemainderEur.toFixed(2)} · 约 CN¥${euroRemainderRmb.toFixed(1)}`, innerR - 14, row2);
                        }
                    }

                    // 12. 底部刊记
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#A8A29E';
                    ctx.font = `10px ${SANS}`;
                    ctx.letterSpacing = '0.6px';
                    ctx.fillText('BY GUIQULAIXI · 理性游玩，清醒自律', midX - 0.3, cardY + cardH - 20);
                    ctx.letterSpacing = '0px';

                    // 13. 导出下载
                    const dataUrl = canvas.toDataURL('image/png', 1.0);
                    const link = document.createElement('a');
                    link.download = `eFootball-筹划票据-${stamp}-${Date.now().toString().slice(-4)}.png`;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    showToast('已生成高画质票据');
                };

                return e(F, null,
                    e('div', { className: 'editorial-wrapper' },
                        e('header', { className: 'book-header' },
                            e('div', { className: 'book-title-group' },
                                e('h1', null, 'eFootball 充值筹划'),
                                e('div', { className: 'sub' }, payMode === 'yen' ? '日服官方特惠 · 纯净核算' : '欧区礼品卡 · 汇率与结余比对')
                            ),
                            e('button', {
                                className: 'theme-btn',
                                onClick: () => setTheme(theme === 'light' ? 'dark' : 'light')
                            }, theme === 'light' ? '夜间沉浸' : '温润日光')
                        ),

                        e('div', { className: 'book-layout' },
                            e('div', { className: 'book-left-panel' },
                                e('div', { className: 'segmented-nav' },
                                    e('button', {
                                        className: 'segmented-btn ' + (payMode === 'euro' ? 'active' : ''),
                                        onClick: () => setPayMode('euro')
                                    }, '欧元礼品卡渠道'),
                                    e('button', {
                                        className: 'segmented-btn ' + (payMode === 'yen' ? 'active' : ''),
                                        onClick: () => setPayMode('yen')
                                    }, '日元直购渠道')
                                ),

                                e('div', { className: 'rate-bar' },
                                    e('div', { className: 'rate-meta' },
                                        e('span', { className: 'title' }, payMode === 'euro' ? '实时牌价 (JPY / EUR)' : '实时牌价 (JPY / CNY)'),
                                        e('span', { className: 'num' }, payMode === 'euro' ? `1 EUR ≈ ${(1 / eurRateForCalc).toFixed(1)} JPY` : `100 JPY ≈ CN¥ ${(cnyRate * 100).toFixed(2)}`)
                                    ),
                                    e('button', { className: 'rate-refresh-btn', onClick: fetchRate, disabled: loading }, loading ? '获取中…' : '校准汇率')
                                ),

                                e('div', { className: 'comparison-slate' },
                                    e('div', { className: 'comp-grid' },
                                        e('div', { className: 'comp-item' },
                                            e('div', { className: 'comp-title' },
                                                '日元官方直购',
                                                (yenCheaper && euroCostOk) ? e('span', { className: 'comp-tag' }, '更优') : null
                                            ),
                                            yenCostOk
                                                ? e('div', { className: 'comp-num' }, bestYen.cnyPerK.toFixed(1), e('span', null, '元 / 千币'))
                                                : e('div', { className: 'comp-num' }, '—'),
                                            e('div', { className: 'comp-desc' }, bestYen ? `${bestYen.name}` : '')
                                        ),
                                        e('div', { className: 'comp-item' },
                                            e('div', { className: 'comp-title' },
                                                '欧元礼品卡',
                                                (!yenCheaper && euroCostOk) ? e('span', { className: 'comp-tag' }, '更优') : null
                                            ),
                                            euroCostOk
                                                ? e('div', { className: 'comp-num' }, bestEuro.cost.toFixed(1), e('span', null, '元 / 千币'))
                                                : e('div', { className: 'comp-num', style: { color: 'var(--text-tertiary)' } }, '待设卡价'),
                                            e('div', { className: 'comp-desc' }, euroCostOk ? `${bestEuro.pack.coins.toLocaleString()} 档位` : '')
                                        )
                                    ),
                                    (yenCostOk && euroCostOk)
                                        ? e('div', { className: 'comp-summary' },
                                            `${yenCheaper ? '日元直购' : '欧元卡'} 单币成本低约 `,
                                            e('em', null, compareDelta.toFixed(1)),
                                            ` 元/千币（差幅 ${compareDeltaPct.toFixed(0)}%）`
                                        )
                                        : null
                                ),

                                payMode === 'euro' ? e('div', { className: 'chapter-box' },
                                    e('div', { className: 'chapter-header' },
                                        e('span', { className: 'chapter-title' }, '购卡参数与口径'),
                                        e('span', { className: 'chapter-note' }, '淘宝 / 平台行情')
                                    ),
                                    e('div', { className: 'editorial-input-group' },
                                        e('input', {
                                            type: 'text',
                                            inputMode: 'decimal',
                                            value: cnyPer10Eur,
                                            onChange: (ev) => setCnyPer10Eur(ev.target.value),
                                            placeholder: '60'
                                        }),
                                        e('span', { className: 'unit' }, 'CN¥ / 10€ 卡')
                                    ),
                                    e('div', { className: 'segmented-nav', style: { marginTop: '12px', marginBottom: 0 } },
                                        e('button', {
                                            className: 'segmented-btn ' + (euroSettleMode === 'roundUp' ? 'active' : ''),
                                            onClick: () => setEuroSettleMode('roundUp')
                                        }, '按整卡核算 (含余额)'),
                                        e('button', {
                                            className: 'segmented-btn ' + (euroSettleMode === 'exact' ? 'active' : ''),
                                            onClick: () => setEuroSettleMode('exact')
                                        }, '按纯消耗核算')
                                    )
                                ) : null,

                                e('div', { className: 'chapter-box' },
                                    e('div', { className: 'chapter-header' },
                                        e('span', { className: 'chapter-title' }, payMode === 'euro' ? 'Steam 欧元常驻档位' : '日服官方限时特惠'),
                                        e('span', { className: 'chapter-note' }, '勾选组合')
                                    ),
                                    e('div', { className: 'pack-grid' },
                                        (payMode === 'euro' ? euroPackList : packList).map(p => {
                                            const isSel = p.qty > 0;
                                            const isBest = payMode === 'yen' && p.id === 'c7300';
                                            return e('div', {
                                                key: p.id,
                                                className: 'pack-row-card ' + (isSel ? 'selected' : ''),
                                                onClick: () => {
                                                    if (payMode === 'euro') {
                                                        setEuroPackQty(prev => ({ ...prev, [p.id]: (prev[p.id] || 0) > 0 ? 0 : 1 }));
                                                    } else {
                                                        setPackQty(prev => ({ ...prev, [p.id]: (prev[p.id] || 0) > 0 ? 0 : 1 }));
                                                    }
                                                }
                                            },
                                                e('div', { className: 'pack-content' },
                                                    e('div', { className: 'pack-primary' },
                                                        e('div', { className: 'pack-marker' }, '✓'),
                                                        e('div', { className: 'pack-info' },
                                                            e('div', { className: 'name' },
                                                                payMode === 'euro' ? `${p.coins.toLocaleString()} 金币` : p.name,
                                                                isBest ? e('span', { className: 'badge-subtle badge-best' }, '最优档') : null
                                                            ),
                                                            e('div', { className: 'meta' },
                                                                payMode === 'euro'
                                                                    ? `折合 €${p.rawEur.toFixed(2)}`
                                                                    : `${p.coins.toLocaleString()} 币 · 限购 ${p.maxQty} 次`
                                                            )
                                                        )
                                                    ),
                                                    e('div', { className: 'pack-valuation' },
                                                        e('div', { className: 'primary-price' }, `JP¥ ${(p.jpy ?? p.yen).toLocaleString()}`),
                                                        e('div', { className: 'sub-price' }, `约 ¥${p.cnyPerK.toFixed(0)} / 千币`)
                                                    )
                                                ),
                                                (isSel && (payMode === 'euro' || p.maxQty > 1)) ? e('div', {
                                                    className: 'stepper-belt',
                                                    onClick: (ev) => ev.stopPropagation()
                                                },
                                                    e('span', { style: { fontSize: '12px', color: 'var(--text-tertiary)', marginRight: 'auto' } }, '选择数量'),
                                                    e('button', {
                                                        className: 'stepper-btn',
                                                        onClick: () => {
                                                            const setter = payMode === 'euro' ? setEuroPackQty : setPackQty;
                                                            setter(prev => ({ ...prev, [p.id]: Math.max(1, prev[p.id] - 1) }));
                                                        },
                                                        disabled: p.qty <= 1
                                                    }, '−'),
                                                    e('span', { className: 'stepper-val' }, p.qty),
                                                    e('button', {
                                                        className: 'stepper-btn',
                                                        onClick: () => {
                                                            const setter = payMode === 'euro' ? setEuroPackQty : setPackQty;
                                                            const max = payMode === 'euro' ? 99 : p.maxQty;
                                                            setter(prev => ({ ...prev, [p.id]: Math.min(max, (prev[p.id] || 0) + 1) }));
                                                        },
                                                        disabled: payMode === 'yen' && p.qty >= p.maxQty
                                                    }, '+')
                                                ) : null
                                            );
                                        })
                                    )
                                )
                            ),

                            e('div', { className: 'book-right-panel' },
                                e('div', { className: 'receipt-card', ref: resultRef },
                                    e('div', { className: 'receipt-stamp' }, 'MONOGRAPH RECEIPT · 核算单'),
                                    e('div', { className: 'receipt-main-cost' },
                                        noSelection
                                            ? e('span', { style: { fontSize: '18px', color: 'var(--text-tertiary)' } }, '尚未勾选档位')
                                            : e(F, null,
                                                e('span', { className: 'curr' }, 'CN¥'),
                                                e('span', { className: 'figure' }, (payMode === 'euro' ? euroTotalRmb : packTotalCny).toFixed(2))
                                            )
                                    ),
                                    noSelection ? null : e('div', { className: 'receipt-coins-yield' },
                                        '获赠金币总量：',
                                        e('b', null, (payMode === 'euro' ? euroTotal.coins : packTotal.coins).toLocaleString()),
                                        ' 币'
                                    ),
                                    noSelection ? null : e('div', { className: 'receipt-breakdown' },
                                        e('div', { className: 'receipt-line' },
                                            e('span', null, '单币成本'),
                                            e('span', { className: 'val' }, `¥ ${heroPerK.toFixed(2)}`, e('small', null, '/ 千币'))
                                        ),
                                        payMode === 'euro' ? e(F, null,
                                            e('div', { className: 'receipt-line' },
                                                e('span', null, '应购面值'),
                                                e('span', { className: 'val' }, `€ ${euroSettleEur}`, e('small', null, `≈ CN¥ ${((euroSettleEur / 10) * validCnyPer10Eur).toFixed(1)}`))
                                            ),
                                            euroRemainderEur > 0 ? e('div', { className: 'receipt-line' },
                                                e('span', null, '账户结余'),
                                                e('span', { className: 'val' }, `€ ${euroRemainderEur.toFixed(2)}`, e('small', null, `(留存下期)`))
                                            ) : null
                                        ) : e('div', { className: 'receipt-line' },
                                            e('span', null, '日元票面总额'),
                                            e('span', { className: 'val' }, `JP¥ ${packTotal.jpy.toLocaleString()}`)
                                        )
                                    )
                                ),

                                e('div', { className: 'editorial-actions' },
                                    e('button', { className: 'action-subtle-btn', onClick: handleCopyText }, '复制筹划文本'),
                                    e('button', { className: 'action-subtle-btn', onClick: handleGeneratePoster }, '生成书签票据')
                                )
                            )
                        ),

                        e('footer', { className: 'book-colophon' },
                            `档位校验于 ${PACK_DATA_VERIFIED_AT} · 官方价格政策以 Steam 与 Konami 公告为准`,
                            e('br'),
                            `Crafted by guiqulaixi`
                        )
                    ),

                    e('div', { className: 'bottom-float-bar' + (barHidden ? ' hidden' : '') },
                        e('div', null,
                            e('div', { className: 'bf-label' }, '每千币均价'),
                            noSelection
                                ? e('div', { className: 'bf-val', style: { fontSize: '15px', color: 'var(--text-tertiary)' } }, '请选择')
                                : e('div', { className: 'bf-val' }, `¥ ${heroPerK.toFixed(2)}`)
                        ),
                        e('div', { className: 'bf-btns' },
                            e('button', { className: 'bf-btn', onClick: handleCopyText }, '复制'),
                            e('button', { className: 'bf-btn', onClick: handleGeneratePoster }, '制图')
                        )
                    ),

                    e('div', { className: 'toast-pill ' + (toastMsg ? 'visible' : '') }, toastMsg)
                );
            }

            ReactDOM.createRoot(document.getElementById('root')).render(e(App));
        })();
    </script>
</body>
</html>
